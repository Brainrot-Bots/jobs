name: Check Job Postings

on:
  schedule:
    - cron: "0 * * * *"  # hourly — per-job schedule logic runs inside the script
  workflow_dispatch:       # manual trigger

permissions:
  contents: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check job postings
        run: node scripts/check-jobs.mjs

      - name: Commit updated cache and README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add status-cache.json README.md
          git diff --cached --quiet || git commit -m "chore: update job status cache and README [skip ci]"
          git push
