name: Check Job Postings

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check if any jobs are configured
        id: jobs_count
        run: echo "count=$(jq '.jobs | length' jobs.json)" >> $GITHUB_OUTPUT

      - uses: actions/setup-node@v4
        if: steps.jobs_count.outputs.count != '0'
        with:
          node-version: "20"

      - name: Check job postings
        if: steps.jobs_count.outputs.count != '0'
        run: node scripts/check-jobs.mjs

      - name: Commit updated cache and README
        if: steps.jobs_count.outputs.count != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add status-cache.json README.md
          git diff --cached --quiet || git commit -m "chore: update job status cache and README [skip ci]"
          git push
