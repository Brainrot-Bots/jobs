name: Check Job Postings

on:
  schedule:
    - cron: "0 9 * * *"   # daily at 9am UTC
  workflow_dispatch:        # manual trigger

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check job postings
        run: node scripts/check-jobs.mjs
